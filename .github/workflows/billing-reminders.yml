name: Billing Reminders

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 08:00 sáng giờ Việt Nam, mỗi ngày
  workflow_dispatch: {} # cho phép bấm chạy tay từ tab Actions để test

jobs:
  check-billing-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi /api/cron/check-billing-reminders
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.BACKEND_URL }}/api/cron/check-billing-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
